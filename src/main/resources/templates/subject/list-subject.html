<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<body>


<div th:replace="~{layout :: layout(~{::section})}">


    <section>

        <!-- ============================
             Page Header
        ============================= -->

        <div class="page-header">

            <div>

                <h1>
                    <i class="bi bi-book-half"></i>
                    My Subjects
                </h1>

                <p>
                    Manage your subjects and organize your learning journey.
                </p>

            </div>


            <a th:href="@{/subjects/new}"
               class="btn btn-primary">

                <i class="bi bi-plus-lg"></i>

                Add Subject

            </a>

        </div>


        <!-- ============================
             Search
        ============================= -->

        <div class="search-container">

            <i class="bi bi-search"></i>

            <input
                    type="text"
                    id="subjectSearch"
                    placeholder="Search subject..."
                    autocomplete="off"
                    aria-label="Search subjects">

        </div>


        <!-- ============================
             Empty State
        ============================= -->

        <div class="empty-state fade-in"
             th:if="${#lists.isEmpty(subjects)}">

            <i class="bi bi-journal-plus"></i>

            <h3>
                No Subjects Added Yet
            </h3>

            <p>
                Start by adding your first subject and take charge of your study plan.
            </p>

            <a th:href="@{/subjects/new}"
               class="btn btn-primary">

                <i class="bi bi-plus-lg"></i>

                Create Subject

            </a>

        </div>


        <!-- ============================
             Subject Cards
        ============================= -->

        <div class="subject-grid"
             th:unless="${#lists.isEmpty(subjects)}">

            <div class="subject-card fade-in"
                 th:each="subject : ${subjects}">

                <!-- Color Indicator -->
                <div class="subject-color"
                     th:classappend="${#strings.toLowerCase(subject.color)}">

                </div>

                <!-- Content -->
                <div class="subject-content">

                    <h3 th:text="${subject.name}">
                        Database
                    </h3>

                    <p th:text="${subject.description}">
                        Description
                    </p>

                    <div class="subject-meta">
                        <span class="subject-badge"
                              th:text="${subject.color}">
                            Purple
                        </span>
                        <span class="topic-count"
                              th:if="${subject.topicCount != null and subject.topicCount > 0}"
                              th:text="${subject.topicCount + ' Topic' + (subject.topicCount > 1 ? 's' : '')}">
                            0 Topics
                        </span>
                        <span class="topic-count-empty"
                              th:if="${subject.topicCount == null or subject.topicCount == 0}">
                            No topics yet
                        </span>
                    </div>

                </div>

                <!-- Actions -->
                <div class="subject-actions">

<a th:href="@{/topics/subject/{subjectId}(subjectId=${subject.id})}"
                       class="action-btn view"
                       title="View Topics"
                       aria-label="View Topics">

                    <i class="bi bi-journal-text"></i>

                </a>

                <a th:href="@{/topics/subject/{subjectId}/new(subjectId=${subject.id})}"
                       class="action-btn add-topic"
                       title="Add Topic"
                       aria-label="Add Topic">

                    <i class="bi bi-plus-lg"></i>

                </a>

                    <a th:href="@{/subjects/edit/{id}(id=${subject.id})}"
                       class="action-btn edit"
                       title="Edit Subject"
                       aria-label="Edit Subject">

                        <i class="bi bi-pencil-square"></i>

                    </a>

                    <a th:href="@{/subjects/delete/{id}(id=${subject.id})}"
                       class="action-btn delete"
                       title="Delete Subject"
                       aria-label="Delete Subject">

                        <i class="bi bi-trash3"></i>

                    </a>

                </div>

            </div>

        </div>

    </section>


</div>


</body>


</html>
