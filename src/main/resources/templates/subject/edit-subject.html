<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Subject | StudyFlow</title>
</head>

<body>

<div th:replace="~{layout :: layout(~{::section})}">

    <section>

        <!-- ============================
             Page Header
        ============================ -->

        <div class="page-header">

            <div>

                <h1>
                    <i class="bi bi-pencil-square"></i>
                    Edit Subject
                </h1>

                <p>
                    Update your subject information.
                </p>

            </div>

        </div>



        <!-- ============================
             Edit Subject Form
        ============================ -->

        <div class="card form-card">

            <form
                    th:action="@{/subjects/update/{id}(id=*{id})}"
                    th:object="${subjectDto}"
                    method="post">

                <!-- Hidden ID -->

                <input
                        type="hidden"
                        th:field="*{id}"/>



                <!-- Subject Name -->

                <div class="form-group">

                    <label for="name">
                        Subject Name
                    </label>

                    <div class="input-with-icon">

                        <i class="bi bi-book"></i>

                        <input
                                id="name"
                                type="text"
                                class="form-control"
                                th:field="*{name}"
                                placeholder="Enter subject name"/>

                    </div>

                    <small
                            class="error-message"
                            th:if="${#fields.hasErrors('name')}"
                            th:errors="*{name}">
                    </small>

                </div>



                <!-- Description -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                            id="description"
                            class="form-control"
                            rows="4"
                            th:field="*{description}"
                            placeholder="Write description">
                    </textarea>

                    <small
                            class="error-message"
                            th:if="${#fields.hasErrors('description')}"
                            th:errors="*{description}">
                    </small>

                </div>



                <!-- Subject Color -->

                <div class="form-group">

                    <label>
                        Choose Subject Color
                    </label>

                    <input
                            type="hidden"
                            th:field="*{color}"
                            id="selectedColor"/>

                    <div class="color-picker">

                        <button
                                type="button"
                                class="color-circle purple"
                                data-color="Purple"
                                title="Purple">
                        </button>

                        <button
                                type="button"
                                class="color-circle blue"
                                data-color="Blue"
                                title="Blue">
                        </button>

                        <button
                                type="button"
                                class="color-circle green"
                                data-color="Green"
                                title="Green">
                        </button>

                        <button
                                type="button"
                                class="color-circle orange"
                                data-color="Orange"
                                title="Orange">
                        </button>

                        <button
                                type="button"
                                class="color-circle red"
                                data-color="Red"
                                title="Red">
                        </button>

                    </div>

                    <small
                            class="error-message"
                            th:if="${#fields.hasErrors('color')}"
                            th:errors="*{color}">
                    </small>

                </div>



                <!-- Buttons -->

                <div class="form-actions">

                    <a
                            th:href="@{/subjects}"
                            class="btn btn-secondary">

                        <i class="bi bi-arrow-left"></i>

                        Cancel

                    </a>

                    <button
                            type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-check-circle"></i>

                        Update Subject

                    </button>

                </div>

            </form>

        </div>

    </section>

</div>

</body>
</html>
