<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">


<body>


<div th:replace="~{layout :: layout(~{::section})}">


    <section class="admin-dashboard">

        <!-- ============================
             Page Header
        ============================= -->

        <div class="page-header admin-page-header">

            <div>

                <h1>
                    <i class="bi bi-person-fill-gear"></i>
                    User Details
                </h1>

                <p>
                    Review and manage a single StudyFlow account.
                </p>

            </div>

            <a th:href="@{/admin/users}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i>
                Back to Users
            </a>

        </div>


        <!-- ============================
             User Overview Card
        ============================= -->

        <div class="admin-card">

            <div class="admin-user-overview">

                <span class="admin-avatar admin-avatar--large">
                    <i class="bi bi-person-fill"></i>
                </span>

                <div class="admin-user-overview__text">

                    <h2 th:text="${adminUser.name}">User Name</h2>

                    <p th:text="${adminUser.email}">user@example.com</p>

                    <div class="admin-user-overview__badges">

                        <span class="admin-role-badge"
                              th:classappend="${#strings.equals(adminUser.role.name(), 'ADMIN')}
                                              ? 'admin-role-badge--admin'
                                              : 'admin-role-badge--user'"
                              th:text="${adminUser.role.name()}">USER</span>

                        <span class="admin-status-badge"
                              th:classappend="${adminUser.enabled}
                                              ? 'admin-status-badge--enabled'
                                              : 'admin-status-badge--disabled'">
                            <i class="bi bi-circle-fill"></i>
                            <span th:text="${adminUser.enabled ? 'Active' : 'Disabled'}">Active</span>
                        </span>

                    </div>

                </div>

            </div>

            <div class="admin-detail-grid">

                <div class="admin-detail-item">
                    <span class="admin-detail-item__label">User ID</span>
                    <span class="admin-detail-item__value" th:text="${adminUser.id}">1</span>
                </div>

                <div class="admin-detail-item">
                    <span class="admin-detail-item__label">Registered</span>
                    <span class="admin-detail-item__value"
                          th:text="${adminUser.createdAt == null
                                    ? '-'
                                    : #temporals.format(adminUser.createdAt, 'MMM d, yyyy')}">
                        Jan 1, 2026
                    </span>
                </div>

                <div class="admin-detail-item">
                    <span class="admin-detail-item__label">Role</span>
                    <span class="admin-detail-item__value" th:text="${adminUser.role.name()}">USER</span>
                </div>

            </div>

        </div>


        <!-- ============================
             Account Management Card
        ============================= -->

        <div class="admin-card">

            <div class="admin-card__header">

                <h2 class="admin-card__title">
                    <i class="bi bi-sliders"></i>
                    Account Management
                </h2>

            </div>

            <div class="admin-management-grid">

                <!-- Role change -->

                <div class="admin-management">

                    <span class="admin-management__title">Change Role</span>

                    <form th:action="@{/admin/users/{id}/role(id=${adminUser.id})}"
                          method="post" class="admin-management__form">

                        <select name="newRole">

                            <option th:each="r : ${roles}"
                                    th:value="${r.name()}"
                                    th:text="${r.name()}"
                                    th:selected="${adminUser.role == r}">
                                USER
                            </option>

                        </select>

                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-arrow-repeat"></i>
                            Update Role
                        </button>

                    </form>

                </div>

                <!-- Enable / disable -->

                <div class="admin-management">

                    <span class="admin-management__title">
                        Account Status
                    </span>

                    <p class="admin-management__hint"
                       th:text="${adminUser.enabled
                                 ? 'This user can log in and use the platform.'
                                 : 'This user cannot log in until the account is re-enabled.'}">
                        Account status hint.
                    </p>

                    <form th:action="@{/admin/users/{id}/enable(id=${adminUser.id})}"
                          method="post">

                        <button type="submit" class="btn"
                                th:classappend="${adminUser.enabled
                                                 ? 'btn-warning'
                                                 : 'btn-primary'}">
                            <i class="bi"
                               th:classappend="${adminUser.enabled
                                                ? 'bi-pause-circle'
                                                : 'bi-play-circle'}"></i>
                            <span th:text="${adminUser.enabled
                                            ? 'Disable Account'
                                            : 'Enable Account'}">Toggle</span>
                        </button>

                    </form>

                </div>

                <!-- Delete -->

                <div class="admin-management admin-management--danger">

                    <span class="admin-management__title">Danger Zone</span>

                    <p class="admin-management__hint">
                        Permanently delete this account. This cannot be undone.
                    </p>

                    <form th:action="@{/admin/users/{id}/delete(id=${adminUser.id})}"
                          method="post" class="admin-delete-form"
                          th:attr="data-user-name=${adminUser.name}">

                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i>
                            Delete User
                        </button>

                    </form>

                </div>

            </div>

        </div>


        <!-- ============================
             Flash toasts (PRG feedback)
        ============================= -->

        <div th:replace="~{fragments/flash :: flashToasts}"></div>


        <!-- User-management JS (delete confirmation) -->
        <script th:src="@{/js/admin-users.js}"></script>

    </section>


</div>


</body>

</html>
