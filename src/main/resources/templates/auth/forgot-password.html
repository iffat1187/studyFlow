<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- =========================================================
     StudyFlow — Forgot Password Page
     Standalone public page (dark theme, purple gradient).
     Reuses the registration page styling via auth.css.
     Submits to /forgot-password.
     Always shows a generic success message (account enumeration
     prevention): it never reveals whether an email exists.
========================================================== -->

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Request a password reset link for your StudyFlow account.">

    <title>Forgot Password · StudyFlow</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Authentication page styles (standalone) -->
    <link rel="stylesheet" th:href="@{/css/auth.css}">

    <!-- Authentication page scripts -->
    <script th:src="@{/js/auth.js}" defer></script>

</head>

<body class="auth-page">

    <!-- Decorative background glows -->
    <div class="auth-glow auth-glow--one" aria-hidden="true"></div>
    <div class="auth-glow auth-glow--two" aria-hidden="true"></div>

    <main class="auth-card">

        <!-- ==========================
             Logo (links to landing page)
        =========================== -->

        <a th:href="@{/}" class="auth-logo" aria-label="StudyFlow home">

            <span class="auth-logo__icon">
                <i class="bi bi-book-half"></i>
            </span>

            <span class="auth-logo__text">
                Study<span>Flow</span>
            </span>

        </a>

        <h1 class="auth-title">Forgot your password?</h1>

        <p class="auth-subtitle">
            Enter the email you signed up with and we'll send you a link to reset your password.
        </p>

        <!-- ==========================
             Generic success banner
             Shown after a request regardless of whether the
             email exists. Never reveals account existence.
        =========================== -->

        <div
                class="auth-success auth-success--banner"
                th:if="${success}"
                role="status"
        >
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
        </div>

        <!-- ==========================
             Forgot Password Form
        =========================== -->

        <form class="auth-form" th:action="@{/forgot-password}" th:object="${forgotPasswordDto}" method="post" novalidate>

            <!-- CSRF token: required by Spring Security, kept enabled. -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <!-- Email -->

            <div class="auth-field">

                <label for="email">Email</label>

                <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        placeholder="you@example.com"
                        autocomplete="email"
                        th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                        autofocus
                >

                <p class="auth-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

            </div>

            <!-- Submit -->

            <button type="submit" class="auth-btn">
                Send Reset Link
                <i class="bi bi-envelope"></i>
            </button>

        </form>

        <!-- ==========================
             Back to sign-in link
        =========================== -->

        <p class="auth-alt">
            Remembered your password?
            <a th:href="@{/login}">Back to sign in</a>
        </p>

    </main>

    <footer class="auth-footer">
        &copy; 2026 StudyFlow. All rights reserved.
    </footer>

</body>

</html>
