<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- =========================================================
     StudyFlow — Registration Page
     Standalone public page (dark theme, purple gradient).
     Login page will be created in a later phase.
========================================================== -->

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your free StudyFlow account and start organizing your studies.">

    <title>Create Account · StudyFlow</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Register page styles (standalone) -->
    <link rel="stylesheet" th:href="@{/css/auth.css}">

    <!-- Authentication page scripts -->
    <script th:src="@{/js/auth.js}" defer></script>

</head>

<body class="auth-page">

    <!-- Decorative background glows -->
    <div class="auth-glow auth-glow--one" aria-hidden="true"></div>
    <div class="auth-glow auth-glow--two" aria-hidden="true"></div>

    <main class="auth-card">

        <!-- ==========================
             Logo (links to landing page)
        =========================== -->

        <a th:href="@{/}" class="auth-logo" aria-label="StudyFlow home">

            <span class="auth-logo__icon">
                <i class="bi bi-book-half"></i>
            </span>

            <span class="auth-logo__text">
                Study<span>Flow</span>
            </span>

        </a>

        <h1 class="auth-title">Create your account</h1>

        <p class="auth-subtitle">
            Organize subjects, plan tasks and track exams — all in one flow.
        </p>

        <!-- ==========================
             Registration Form
        =========================== -->

        <form class="auth-form" th:action="@{/register}" th:object="${registerDto}" method="post" novalidate>

            <!-- CSRF token: required by Spring Security, kept enabled. -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <!-- Name -->

            <div class="auth-field">

                <label for="name">Name</label>

                <input
                        type="text"
                        id="name"
                        th:field="*{name}"
                        placeholder="Your full name"
                        th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                >

                <p class="auth-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

            </div>

            <!-- Email -->

            <div class="auth-field">

                <label for="email">Email</label>

                <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        placeholder="you@example.com"
                        autocomplete="email"
                        th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                >

                <p class="auth-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

            </div>

            <!-- Password -->

            <div class="auth-field">

                <label for="password">Password</label>

                <div class="password-wrapper">

                    <input
                            type="password"
                            id="password"
                            th:field="*{password}"
                            placeholder="At least 6 characters"
                            autocomplete="new-password"
                            th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                    >

                    <button
                            type="button"
                            class="password-toggle"
                            data-label-show="Show password"
                            data-label-hide="Hide password"
                            aria-label="Show password"
                            aria-pressed="false"
                            tabindex="0"
                    >
                        <i class="bi bi-eye" aria-hidden="true"></i>
                    </button>

                </div>

                <p class="auth-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

            </div>

            <!-- Confirm Password -->

            <div class="auth-field">

                <label for="confirmPassword">Confirm Password</label>

                <div class="password-wrapper">

                    <input
                            type="password"
                            id="confirmPassword"
                            th:field="*{confirmPassword}"
                            placeholder="Repeat your password"
                            autocomplete="new-password"
                            th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                    >

                    <button
                            type="button"
                            class="password-toggle"
                            data-label-show="Show confirm password"
                            data-label-hide="Hide confirm password"
                            aria-label="Show confirm password"
                            aria-pressed="false"
                            tabindex="0"
                    >
                        <i class="bi bi-eye" aria-hidden="true"></i>
                    </button>

                </div>

                <p class="auth-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>

            </div>

            <!-- Submit -->

            <button type="submit" class="auth-btn">
                Create Account
                <i class="bi bi-arrow-right"></i>
            </button>

        </form>

        <!-- ==========================
             Sign-in link (login page is a later phase)
        =========================== -->

        <p class="auth-alt">
            Already have an account?
            <a th:href="@{/login}">Sign in</a>
        </p>

    </main>

    <footer class="auth-footer">
        &copy; 2026 StudyFlow. All rights reserved.
    </footer>

</body>

</html>
