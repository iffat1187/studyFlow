<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Topic | StudyFlow</title>
</head>

<body>

<div th:replace="~{layout :: layout(~{::section})}">

    <section>

        <!-- ============================
             Page Header
        ============================ -->

        <div class="page-header">

            <div>

                <h1>
                    <i class="bi bi-pencil-square"></i>
                    Edit Topic
                </h1>

                <p th:if="${topicDto.subjectName != null}">
                    Edit a topic in <strong th:text="${topicDto.subjectName}">Subject</strong>.
                </p>
                <p th:if="${topicDto.subjectName == null}">
                    Update your topic information.
                </p>

            </div>


<a th:if="${topicDto.subjectId != null}"
               th:href="@{/topics/subject/{subjectId}(subjectId=${topicDto.subjectId})}"
               class="btn btn-secondary">

            <i class="bi bi-arrow-left"></i>

            Back to Topics

        </a>
            <a th:if="${topicDto.subjectId == null}"
               th:href="@{/topics}"
               class="btn btn-secondary">

                <i class="bi bi-arrow-left"></i>

                Back to Topics

            </a>

        </div>





        <!-- ============================
             Edit Topic Form
        ============================ -->

        <div class="card form-card">

            <form
                    th:action="@{/topics/update/{id}(id=*{id})}"
                    th:object="${topicDto}"
                    method="post">

                <!-- CSRF token: required by Spring Security -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <!-- Hidden ID -->

                <input
                        type="hidden"
                        th:field="*{id}"/>

                <!-- Hidden Subject ID -->

                <input
                        type="hidden"
                        th:field="*{subjectId}"/>

                <!-- Subject Display (read-only) -->
                <div class="form-group">
                    <label>
                        Subject
                    </label>
                    <div class="form-control-static subject-display">
                        <i class="bi bi-book-half"></i>
                        <span th:text="${topicDto.subjectName != null ? topicDto.subjectName : 'Unknown'}">Subject</span>
                    </div>
                </div>





                <!-- Topic Name -->

                <div class="form-group">

                    <label for="name">
                        Topic Name
                    </label>

                    <div class="input-with-icon">

                        <i class="bi bi-journal-text"></i>

                        <input
                                id="name"
                                type="text"
                                class="form-control"
                                th:field="*{name}"
                                placeholder="Enter topic name"/>

                    </div>

                    <small
                            class="error-message"
                            th:if="${#fields.hasErrors('name')}"
                            th:errors="*{name}">
                    </small>

                </div>





                <!-- Description -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                            id="description"
                            class="form-control"
                            rows="4"
                            th:field="*{description}"
                            placeholder="Write description">
                    </textarea>

                    <small
                            class="error-message"
                            th:if="${#fields.hasErrors('description')}"
                            th:errors="*{description}">
                    </small>

                </div>





                <!-- Buttons -->

                <div class="form-actions">

<a th:if="${topicDto.subjectId != null}"
                       th:href="@{/topics/subject/{subjectId}(subjectId=${topicDto.subjectId})}"
                       class="btn btn-secondary">

                    <i class="bi bi-arrow-left"></i>

                    Cancel

                </a>
                    <a th:if="${topicDto.subjectId == null}"
                       th:href="@{/topics}"
                       class="btn btn-secondary">

                        <i class="bi bi-arrow-left"></i>

                        Cancel

                    </a>

                    <button
                            type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-check-circle"></i>

                        Update Topic

                    </button>

                </div>

            </form>

        </div>

    </section>

</div>

</body>

</html>
