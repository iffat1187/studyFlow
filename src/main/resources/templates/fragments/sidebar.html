<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- =========================================================
     StudyFlow Sidebar Fragment
========================================================= -->

<div th:fragment="sidebar">

    <aside class="sidebar">

        <!-- ==========================================
             Logo
        =========================================== -->

        <div class="sidebar-logo">

            <a th:href="@{/}" class="logo-link">

                <i class="bi bi-book-half logo-icon"></i>

                <div class="logo-text">

                    <h2>
                        Study<span>Flow</span>
                    </h2>

                    <p>
                        Smart Study Planner
                    </p>

                </div>

            </a>

        </div>

        <!-- ==========================================
             Sidebar Body
        =========================================== -->

        <div class="sidebar-body">

            <!-- ==========================
                 MAIN
            =========================== -->

            <div class="menu-title">
                MAIN
            </div>

            <nav class="sidebar-menu">

                <ul>

                    <li>

                        <a th:href="@{/}">

                            <i class="bi bi-grid-fill"></i>

                            <span>Dashboard</span>

                        </a>

                    </li>

                    <li>

                        <!-- Active Page -->

                        <a th:href="@{/subjects}" class="active">

                            <i class="bi bi-book-half"></i>

                            <span>Subjects</span>

                        </a>

                    </li>

                    <li>

                        <a th:href="@{/topics}">

                            <i class="bi bi-journal-text"></i>

                            <span>Topics</span>

                        </a>

                    </li>

                </ul>

            </nav>



            <!-- ==========================
                 PLANNING
            =========================== -->

            <div class="menu-title">
                PLANNING
            </div>

            <nav class="sidebar-menu">

                <ul>

                    <li>

                        <a th:href="@{/tasks}">

                            <i class="bi bi-list-check"></i>

                            <span>Tasks</span>

                        </a>

                    </li>

                    <li>

                        <a th:href="@{/study-sessions}">

                            <i class="bi bi-stopwatch"></i>

                            <span>Study Sessions</span>

                        </a>

                    </li>

                    <li>

                        <a th:href="@{/exams}">

                            <i class="bi bi-calendar-event"></i>

                            <span>Exams</span>

                        </a>

                    </li>

                </ul>

            </nav>



            <!-- ==========================
                 INSIGHTS
            =========================== -->

            <div class="menu-title">
                INSIGHTS
            </div>

            <nav class="sidebar-menu">

                <ul>

                    <li>

                        <a th:href="@{/analytics}">

                            <i class="bi bi-bar-chart-line"></i>

                            <span>Analytics</span>

                        </a>

                    </li>

                </ul>

            </nav>



            <!-- ==========================
                 ADMIN (visible to ROLE_ADMIN only)
            =========================== -->

            <th:block sec:authorize="hasRole('ADMIN')">

                <div class="menu-title">
                    ADMIN
                </div>

                <nav class="sidebar-menu">

                    <ul>

                        <li>

                            <a th:href="@{/admin/dashboard}">

                                <i class="bi bi-shield-lock"></i>

                                <span>Admin Dashboard</span>

                            </a>

                        </li>

                        <li>

                            <a th:href="@{/admin/users}">

                                <i class="bi bi-people-fill"></i>

                                <span>User Management</span>

                            </a>

                        </li>

                    </ul>

                </nav>

            </th:block>



            <!-- ==========================
                 SYSTEM
            =========================== -->

            <div class="menu-title">
                SYSTEM
            </div>

            <nav class="sidebar-menu">

                <ul>

                    <li>

                        <a href="#">

                            <i class="bi bi-gear"></i>

                            <span>Settings</span>

                        </a>

                    </li>

                </ul>

            </nav>

        </div>



        <!-- ==========================================
             Sidebar Footer
        =========================================== -->

        <div class="sidebar-footer">

            <span class="version-badge">
                Version 1.0
            </span>

            <small>
                Spring Boot • JPA • MySQL
            </small>

            <small>
                Crafted with ❤️ for students
            </small>

        </div>

    </aside>

</div>

</html>
