<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--
=========================================================
    Top Navbar Fragment
    Reusable across the entire StudyFlow application.
    Authentication-aware: shows the signed-in user's
    email and role plus a Spring Security logout control.
=========================================================
-->

<div th:fragment="navbar">

    <header class="top-navbar">

        <!-- ==========================
             Left Section
        =========================== -->
        <div class="navbar-left">

            <!-- Sidebar Toggle -->
            <button class="menu-toggle" id="menuToggle" title="Toggle Sidebar">
                <i class="bi bi-list"></i>
            </button>

            <!-- Current Page Title -->
<!--            <div class="page-heading">-->

<!--                <h2 class="page-title">-->
<!--                    Dashboard-->
<!--                </h2>-->

<!--                <p class="page-subtitle">-->
<!--                    Stay organized and achieve your study goals.-->
<!--                </p>-->

<!--            </div>-->

<!--        </div>-->

        <!-- ==========================
             Right Section
        =========================== -->
        <div class="navbar-right">

            <!-- Search Box -->
            <div class="search-box">

                <i class="bi bi-search"></i>

                <input
                        type="text"
                        id="globalSearch"
                        placeholder="Search subjects, tasks, exams..."
                        autocomplete="off">

            </div>

            <!-- Notification Bell + Dropdown -->
            <div class="notification-menu" id="notificationMenu">

                <button
                        class="icon-button"
                        id="notificationBell"
                        type="button"
                        title="Notifications"
                        aria-haspopup="true"
                        aria-expanded="false">

                    <i class="bi bi-bell"></i>

                    <span
                            class="notification-badge"
                            id="notificationBadge"
                            th:if="${navbarUnreadCount > 0}"
                            th:text="${navbarUnreadCount}">
                        0
                    </span>

                </button>

                <div class="notification-dropdown" id="notificationDropdown">

                    <div class="notification-dropdown__header">

                        <span class="notification-dropdown__title">Notifications</span>

                        <button
                                type="button"
                                class="notification-dropdown__mark-all"
                                id="notificationMarkAll">
                            Mark all read
                        </button>

                    </div>

                    <ul class="notification-list">
                        <li
                                th:each="n : ${navbarRecentNotifications}"
                                class="notification-item"
                                th:classappend="${!n.read()} ? 'is-unread'">
                            <a
                                    class="notification-item__link"
                                    th:href="${n.href() != null ? n.href() : '/notifications'}"
                                    th:attr="data-notif-id=${n.id()},data-notif-read=${n.read()},data-notif-href=${n.href() != null ? n.href() : ''},data-notif-time=${n.createdAt()}">

                                <span class="notification-item__icon">
                                    <i th:class="'bi ' + ${n.icon()}"></i>
                                </span>

                                <span class="notification-item__body">
                                    <span class="notification-item__title" th:text="${n.title()}">
                                        Notification title
                                    </span>
                                    <span class="notification-item__time" th:text="${n.typeLabel()}">
                                        type
                                    </span>
                                </span>

                                <span class="notification-item__dot" th:if="${!n.read()}"></span>

                            </a>
                        </li>
                    </ul>

                    <div
                            class="notification-dropdown__empty"
                            th:if="${#lists.isEmpty(navbarRecentNotifications)}">
                        No notifications yet.
                    </div>

                    <a class="notification-dropdown__view-all" th:href="@{/notifications}">
                        View All Notifications
                    </a>

                </div>

            </div>

            <!-- Theme Toggle (Future Feature) -->
            <button
                    class="icon-button"
                    id="themeToggle"
                    title="Dark / Light Mode">

                <i class="bi bi-moon-stars"></i>

            </button>

            <!-- User Menu -->
            <div class="profile-menu">

                <button
                        class="profile-button"
                        type="button"
                        aria-haspopup="true"
                        aria-expanded="false">

                    <div class="profile-avatar">

                        <img
                                th:if="${currentProfileImageName != null}"
                                th:src="@{/profile/picture/{file}(file=${currentProfileImageName})}"
                                th:alt="'Profile picture'">

                        <i th:unless="${currentProfileImageName != null}" class="bi bi-person-circle"></i>

                    </div>

                    <div class="profile-details">

                        <span class="profile-name"

                              th:text="'Welcome, ' + ${#authentication.name}">

                            Welcome, user@example.com

                        </span>

                        <small class="profile-role">

                            <span sec:authorize="hasRole('ADMIN')">ADMIN</span>

                            <span sec:authorize="hasRole('USER')">USER</span>

                        </small>

                    </div>

                    <i class="bi bi-chevron-down profile-arrow"></i>

                </button>

                <div class="profile-dropdown">

                    <a class="profile-dropdown__link" th:href="@{/profile}">

                        <i class="bi bi-person-circle"></i>

                        <span>Profile</span>

                    </a>

                    <form
                            class="profile-dropdown__form"
                            th:action="@{/logout}"
                            method="post">

                        <!-- CSRF token: required by Spring Security, kept enabled. -->
                        <input
                                type="hidden"
                                th:name="${_csrf.parameterName}"
                                th:value="${_csrf.token}"/>

                        <button
                                type="submit"
                                class="profile-dropdown__link">

                            <i class="bi bi-box-arrow-right"></i>

                            <span>Logout</span>

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </header>

</div>

</html>
