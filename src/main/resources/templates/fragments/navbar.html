<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--
=========================================================
    Top Navbar Fragment
    Reusable across the entire StudyFlow application.
    Authentication-aware: shows the signed-in user's
    email and role plus a Spring Security logout control.
=========================================================
-->

<div th:fragment="navbar">

    <header class="top-navbar">

        <!-- ==========================
             Left Section
        =========================== -->
        <div class="navbar-left">

            <!-- Sidebar Toggle -->
            <button class="menu-toggle" id="menuToggle" title="Toggle Sidebar">
                <i class="bi bi-list"></i>
            </button>

            <!-- Current Page Title -->
<!--            <div class="page-heading">-->

<!--                <h2 class="page-title">-->
<!--                    Dashboard-->
<!--                </h2>-->

<!--                <p class="page-subtitle">-->
<!--                    Stay organized and achieve your study goals.-->
<!--                </p>-->

<!--            </div>-->

<!--        </div>-->

        <!-- ==========================
             Right Section
        =========================== -->
        <div class="navbar-right">

            <!-- Search Box -->
            <div class="search-box">

                <i class="bi bi-search"></i>

                <input
                        type="text"
                        id="globalSearch"
                        placeholder="Search subjects, tasks, exams..."
                        autocomplete="off">

            </div>

            <!-- Notification -->
            <button class="icon-button" title="Notifications">

                <i class="bi bi-bell"></i>

                <span class="notification-badge">
                    0
                </span>

            </button>

            <!-- Theme Toggle (Future Feature) -->
            <button
                    class="icon-button"
                    id="themeToggle"
                    title="Dark / Light Mode">

                <i class="bi bi-moon-stars"></i>

            </button>

            <!-- User Menu -->
            <div class="profile-menu">

                <button
                        class="profile-button"
                        type="button"
                        aria-haspopup="true"
                        aria-expanded="false">

                    <div class="profile-avatar">

                        <i class="bi bi-person-circle"></i>

                    </div>

                    <div class="profile-details">

                        <span class="profile-name"

                              th:text="'Welcome, ' + ${#authentication.name}">

                            Welcome, user@example.com

                        </span>

                        <small class="profile-role">

                            <span sec:authorize="hasRole('ADMIN')">ADMIN</span>

                            <span sec:authorize="hasRole('USER')">USER</span>

                        </small>

                    </div>

                    <i class="bi bi-chevron-down profile-arrow"></i>

                </button>

                <!--
                    Profile dropdown.
                    Only Logout is functional in this phase.
                -->

                <div class="profile-dropdown">

                    <form
                            class="profile-dropdown__form"
                            th:action="@{/logout}"
                            method="post">

                        <!-- CSRF token: required by Spring Security, kept enabled. -->
                        <input
                                type="hidden"
                                th:name="${_csrf.parameterName}"
                                th:value="${_csrf.token}"/>

                        <button
                                type="submit"
                                class="profile-dropdown__link">

                            <i class="bi bi-box-arrow-right"></i>

                            <span>Logout</span>

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </header>

</div>

</html>
