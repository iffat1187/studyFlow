<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:replace="~{layout :: layout(~{::section})}">

    <section class="profile-page">

        <!-- ============================
             Page Header
        ============================= -->

        <div class="page-header">

            <div>

                <h1>
                    <i class="bi bi-person-circle"></i>
                    My Profile
                </h1>

                <p>
                    View your account information.
                </p>

            </div>

            <a th:href="@{/profile/edit}" class="btn btn-primary">

                <i class="bi bi-pencil-square"></i>

                Edit Profile

            </a>

        </div>

        <!-- ============================
             Profile Overview
        ============================= -->

        <div class="profile-overview card">

            <div class="profile-avatar">

                <img th:if="${currentProfileImageName != null}"
                     th:src="@{/profile/picture/{file}(file=${currentProfileImageName})}"
                     th:alt="'Profile picture'">

                <i th:unless="${currentProfileImageName != null}" class="bi bi-person-circle"></i>

            </div>

            <div class="profile-overview__text">

                <h2 th:text="${profileDto.name}">User Name</h2>

                <p th:text="${profileDto.email}">user@example.com</p>

            </div>

            <div class="profile-photo-actions">

                <!-- Upload / Change Photo -->
                <form class="profile-photo-form"
                      th:action="@{/profile/picture}"
                      method="post"
                      enctype="multipart/form-data">

                    <!-- CSRF token: required by Spring Security, kept enabled. -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <label class="btn btn-outline profile-photo-form__choose">
                        <i class="bi bi-image"></i>
                        Choose Photo
                        <input type="file"
                               id="profilePictureInput"
                               name="file"
                               accept="image/jpeg,image/png"
                               style="display:none">
                    </label>

                    <img id="profilePicturePreview"
                         class="profile-photo-preview"
                         alt="Selected photo preview"
                         style="display:none">

                    <div class="profile-photo-message" id="profilePhotoMessage"></div>

                    <button type="submit" class="btn btn-primary" id="profilePictureUploadBtn" disabled>

                        <i class="bi bi-cloud-arrow-up"></i>

                        <span th:if="${currentProfileImageName != null}">Change Photo</span>

                        <span th:unless="${currentProfileImageName != null}">Upload Photo</span>

                    </button>

                </form>

                <!-- Remove Photo (only when an image exists) -->
                <form th:if="${currentProfileImageName != null}"
                      class="profile-photo-remove"
                      th:action="@{/profile/picture/delete}"
                      method="post">

                    <!-- CSRF token: required by Spring Security, kept enabled. -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <button type="submit" class="btn btn-danger">

                        <i class="bi bi-trash"></i>

                        Remove Photo

                    </button>

                </form>

            </div>

        </div>

        <!-- ============================
             Account Information
        ============================= -->

        <div class="card profile-card">

            <div class="profile-card__header">

                <h3>
                    <i class="bi bi-info-circle"></i>
                    Account Information
                </h3>

            </div>

            <ul class="profile-info-list">

                <li>

                    <span class="profile-info-list__label">Full Name</span>

                    <span class="profile-info-list__value" th:text="${profileDto.name}">User Name</span>

                </li>

                <li>

                    <span class="profile-info-list__label">Email</span>

                    <span class="profile-info-list__value" th:text="${profileDto.email}">user@example.com</span>

                </li>

            </ul>

        </div>

        <!-- ============================
             Security — Change Password
        ============================= -->

        <div class="card profile-card">

            <div class="profile-card__header">

                <h3>
                    <i class="bi bi-shield-lock"></i>
                    Security
                </h3>

            </div>

            <div class="profile-card__body">

                <form
                        th:action="@{/profile/change-password}"
                        th:object="${changePasswordDto}"
                        method="post"
                        class="change-password-form">

                    <!-- CSRF token: required by Spring Security, kept enabled. -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <!-- Current Password -->

                    <div class="form-group">

                        <label for="currentPassword">
                            Current Password
                        </label>

                        <div class="input-with-icon password-field">

                            <i class="bi bi-lock"></i>

                            <input
                                    id="currentPassword"
                                    type="password"
                                    class="form-control"
                                    th:field="*{currentPassword}"
                                    placeholder="Enter current password"/>

                            <button type="button"
                                    class="password-toggle"
                                    data-target="currentPassword"
                                    aria-label="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>

                        </div>

                        <small
                                class="error-message"
                                th:if="${#fields.hasErrors('currentPassword')}"
                                th:errors="*{currentPassword}">
                        </small>

                    </div>

                    <!-- New Password -->

                    <div class="form-group">

                        <label for="newPassword">
                            New Password
                        </label>

                        <div class="input-with-icon password-field">

                            <i class="bi bi-lock"></i>

                            <input
                                    id="newPassword"
                                    type="password"
                                    class="form-control"
                                    th:field="*{newPassword}"
                                    placeholder="Enter new password"/>

                            <button type="button"
                                    class="password-toggle"
                                    data-target="newPassword"
                                    aria-label="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>

                        </div>

                        <small
                                class="error-message"
                                th:if="${#fields.hasErrors('newPassword')}"
                                th:errors="*{newPassword}">
                        </small>

                    </div>

                    <!-- Confirm New Password -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm New Password
                        </label>

                        <div class="input-with-icon password-field">

                            <i class="bi bi-lock"></i>

                            <input
                                    id="confirmPassword"
                                    type="password"
                                    class="form-control"
                                    th:field="*{confirmPassword}"
                                    placeholder="Confirm new password"/>

                            <button type="button"
                                    class="password-toggle"
                                    data-target="confirmPassword"
                                    aria-label="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>

                        </div>

                        <small
                                class="error-message"
                                th:if="${#fields.hasErrors('confirmPassword')}"
                                th:errors="*{confirmPassword}">
                        </small>

                    </div>

                    <!-- Button -->

                    <div class="form-actions">

                        <button
                                type="submit"
                                class="btn btn-primary">

                            <i class="bi bi-shield-check"></i>

                            Change Password

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </section>

</div>

</body>

</html>
