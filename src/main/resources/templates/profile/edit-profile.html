<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:replace="~{layout :: layout(~{::section})}">

    <section class="profile-page">

        <!-- ============================
             Page Header
        ============================= -->

        <div class="page-header">

            <div>

                <h1>
                    <i class="bi bi-pencil-square"></i>
                    Edit Profile
                </h1>

                <p>
                    Update your account information.
                </p>

            </div>

            <a th:href="@{/profile}" class="btn btn-secondary">

                <i class="bi bi-arrow-left"></i>

                Back to Profile

            </a>

        </div>

        <!-- ============================
             Edit Profile Form
        ============================= -->

        <div class="card form-card">

            <form
                    th:action="@{/profile}"
                    th:object="${profileDto}"
                    method="post">

                <!-- CSRF token: required by Spring Security, kept enabled. -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- Full Name (editable) -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <div class="input-with-icon">

                        <i class="bi bi-person"></i>

                        <input
                                id="name"
                                type="text"
                                class="form-control"
                                th:field="*{name}"
                                placeholder="Enter your full name"/>

                    </div>

                    <small
                            class="error-message"
                            th:if="${#fields.hasErrors('name')}"
                            th:errors="*{name}">
                    </small>

                </div>

                <!-- Email (read-only login identifier) -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-with-icon">

                        <i class="bi bi-envelope"></i>

                        <input
                                id="email"
                                type="email"
                                class="form-control"
                                th:value="${profileEmail}"
                                readonly/>

                    </div>

                    <small class="profile-form-hint">
                        Email is your login identifier and cannot be changed.
                    </small>

                </div>

                <!-- Buttons -->

                <div class="form-actions">

                    <a th:href="@{/profile}" class="btn btn-secondary">

                        <i class="bi bi-arrow-left"></i>

                        Cancel

                    </a>

                    <button
                            type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-check-circle"></i>

                        Save Changes

                    </button>

                </div>

            </form>

        </div>

    </section>

</div>

</body>

</html>
