<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>
        Add Task | StudyFlow
    </title>

</head>

<body>

<div th:replace="~{layout :: layout(~{::section})}">

    <section>

        <!-- ============================
             Page Header
        ============================ -->

        <div class="page-header">

            <div>

                <h1>
                    <i class="bi bi-list-check"></i>
                    Add New Task
                </h1>

                <p th:if="${selectedSubject != null}">
                    Add a task to <strong th:text="${selectedSubject.name}">Subject</strong>.
                </p>
                <p th:if="${selectedSubject == null}">
                    Create a task to organize your study work.
                </p>

            </div>


            <a th:href="@{/tasks}"
               class="btn btn-secondary">

                <i class="bi bi-arrow-left"></i>

                Back to Tasks

            </a>

        </div>





        <!-- ============================
             Task Form Card
        ============================ -->

        <div class="card form-card">

            <form
                    th:action="@{/tasks/save}"
                    th:object="${taskDto}"
                    method="post">

                <!-- CSRF token: required by Spring Security -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />


                <!-- Subject Selection -->
                <div class="form-group" th:if="${selectedSubject == null}">

                    <label for="subjectId">
                        Subject <span class="required">*</span>
                    </label>

                    <select
                            id="subjectId"
                            class="form-control"
                            th:field="*{subjectId}"
                            required>
                        <option value="">Select a Subject</option>
                        <option th:each="subject : ${subjects}"
                                th:value="${subject.id}"
                                th:text="${subject.name}"
                                th:selected="${subject.id == taskDto.subjectId}">
                        </option>
                    </select>

                    <small class="error-message"
                           th:if="${#fields.hasErrors('subjectId')}"
                           th:errors="*{subjectId}">
                    </small>

                </div>

                <div class="form-group subject-display" th:if="${selectedSubject != null}">
                    <label>Subject</label>
                    <div class="form-control-static">
                        <i class="bi bi-book-half"></i>
                        <span th:text="${selectedSubject.name}">Subject</span>
                    </div>
                    <!-- Hidden Subject ID for pre-selected subject -->
                    <input type="hidden" th:field="*{subjectId}"/>
                </div>





                <!-- Task Title -->

                <div class="form-group">

                    <label for="title">
                        Title <span class="required">*</span>
                    </label>

                    <div class="input-with-icon">

                        <i class="bi bi-pencil-square"></i>

                        <input
                                type="text"
                                id="title"
                                class="form-control"
                                th:field="*{title}"
                                placeholder="Example: Complete Chapter 4 exercises"
                                required>

                    </div>

                    <small class="error-message"
                           th:if="${#fields.hasErrors('title')}"
                           th:errors="*{title}">
                    </small>

                </div>





                <!-- Task Type -->

                <div class="form-group">

                    <label for="type">
                        Type <span class="required">*</span>
                    </label>

                    <select
                            id="type"
                            class="form-control"
                            th:field="*{type}"
                            required>
                        <option value="">Select Task Type</option>
                        <option th:each="type : ${T(com.studyflow.studyflow.entity.TaskType).values()}"
                                th:value="${type.name()}"
                                th:text="${type.name()}"
                                th:selected="${type == taskDto.type}">
                        </option>
                    </select>

                    <small class="error-message"
                           th:if="${#fields.hasErrors('type')}"
                           th:errors="*{type}">
                    </small>

                </div>





                <!-- Due Date -->

                <div class="form-group">

                    <label for="dueDate">
                        Due Date <span class="required">*</span>
                    </label>

                    <div class="input-with-icon">

                        <i class="bi bi-calendar"></i>

                        <input
                                type="date"
                                id="dueDate"
                                class="form-control"
                                th:field="*{dueDate}"
                                required>

                    </div>

                    <small class="error-message"
                           th:if="${#fields.hasErrors('dueDate')}"
                           th:errors="*{dueDate}">
                    </small>

                </div>





                <!-- Due Time -->

                <div class="form-group">

                    <label for="dueTime">
                        Due Time
                    </label>

                    <div class="input-with-icon">

                        <i class="bi bi-clock"></i>

                        <input
                                type="time"
                                id="dueTime"
                                class="form-control"
                                th:field="*{dueTime}">

                    </div>

                </div>





                <!-- Recurrence -->

                <div class="form-group">

                    <label for="recurrenceType">
                        Occurs <span class="required">*</span>
                    </label>

                    <select
                            id="recurrenceType"
                            class="form-control"
                            th:field="*{recurrenceType}"
                            required>
                        <option th:each="rec : ${T(com.studyflow.studyflow.entity.RecurrenceType).values()}"
                                th:value="${rec.name()}"
                                th:text="${rec.name()}"
                                th:selected="${rec == taskDto.recurrenceType}">
                        </option>
                    </select>

                    <small class="error-message"
                           th:if="${#fields.hasErrors('recurrenceType')}"
                           th:errors="*{recurrenceType}">
                    </small>

                </div>





                <!-- Details -->

                <div class="form-group">

                    <label for="details">
                        Details
                    </label>

                    <textarea
                            id="details"
                            class="form-control"
                            rows="4"
                            th:field="*{details}"
                            placeholder="Optional: Add notes, links, or additional context...">
                    </textarea>

                    <small class="error-message"
                           th:if="${#fields.hasErrors('details')}"
                           th:errors="*{details}">
                    </small>

                </div>





                <!-- Buttons -->

                <div class="form-actions">

                    <a th:if="${taskDto.subjectId != null}"
                       th:href="@{/tasks}"
                       class="btn btn-secondary">

                        <i class="bi bi-arrow-left"></i>

                        Cancel

                    </a>

                    <button
                            type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-save"></i>

                        Save Task

                    </button>

                </div>

            </form>

        </div>

    </section>

</div>

</div>

</body>
</html>
