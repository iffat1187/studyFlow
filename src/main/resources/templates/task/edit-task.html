<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Task | StudyFlow</title>
</head>

<body>

<div th:replace="~{layout :: layout(~{::section})}">

    <section>

        <!-- ============================
             Page Header
        ============================ -->

        <div class="page-header">

            <div>

                <h1>
                    <i class="bi bi-pencil-square"></i>
                    Edit Task
                </h1>

                <p th:if="${taskDto.subjectName != null}">
                    Edit a task in <strong th:text="${taskDto.subjectName}">Subject</strong>.
                </p>
                <p th:if="${taskDto.subjectName == null}">
                    Update your task information.
                </p>

            </div>


            <a th:href="@{/tasks}"
               class="btn btn-secondary">

                <i class="bi bi-arrow-left"></i>

                Back to Tasks

            </a>

        </div>





        <!-- ============================
             Edit Task Form
        ============================ -->

        <div class="card form-card">

            <form
                    th:action="@{/tasks/update/{id}(id=*{id})}"
                    th:object="${taskDto}"
                    method="post">

                <!-- CSRF token: required by Spring Security -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <!-- Hidden ID -->

                <input
                        type="hidden"
                        th:field="*{id}"/>

                <!-- Hidden Subject ID -->

                <input
                        type="hidden"
                        th:field="*{subjectId}"/>





                <!-- Subject Selection -->
                <div class="form-group">

                    <label for="subjectId">
                        Subject <span class="required">*</span>
                    </label>

                    <div class="form-control-static subject-display" th:if="${taskDto.subjectName != null}">
                        <i class="bi bi-book-half"></i>
                        <span th:text="${taskDto.subjectName}">Subject</span>
                    </div>
                    <input
                            type="hidden"
                            th:field="*{subjectId}"
                            th:if="${taskDto.subjectName != null}"/>
                    <select
                            id="subjectId"
                            class="form-control"
                            th:field="*{subjectId}"
                            required
                            th:if="${taskDto.subjectName == null}">
                        <option value="">Select a Subject</option>
                        <option th:each="subject : ${subjects}"
                                th:value="${subject.id}"
                                th:text="${subject.name}"
                                th:selected="${subject.id == taskDto.subjectId}">
                        </option>
                    </select>

                    <small class="error-message"
                           th:if="${#fields.hasErrors('subjectId')}"
                           th:errors="*{subjectId}">
                    </small>

                </div>





                <!-- Task Title -->

                <div class="form-group">

                    <label for="title">
                        Title <span class="required">*</span>
                    </label>

                    <div class="input-with-icon">

                        <i class="bi bi-pencil-square"></i>

                        <input
                                id="title"
                                type="text"
                                class="form-control"
                                th:field="*{title}"
                                placeholder="Enter task title"
                                required/>

                    </div>

                    <small class="error-message"
                           th:if="${#fields.hasErrors('title')}"
                           th:errors="*{title}">
                    </small>

                </div>





                <!-- Task Type -->

                <div class="form-group">

                    <label for="type">
                        Type <span class="required">*</span>
                    </label>

                    <select
                            id="type"
                            class="form-control"
                            th:field="*{type}"
                            required>
                        <option value="">Select Task Type</option>
                        <option th:each="type : ${T(com.studyflow.studyflow.entity.TaskType).values()}"
                                th:value="${type.name()}"
                                th:text="${type.name()}"
                                th:selected="${type == taskDto.type}">
                        </option>
                    </select>

                    <small class="error-message"
                           th:if="${#fields.hasErrors('type')}"
                           th:errors="*{type}">
                    </small>

                </div>





                <!-- Due Date -->

                <div class="form-group">

                    <label for="dueDate">
                        Due Date <span class="required">*</span>
                    </label>

                    <div class="input-with-icon">

                        <i class="bi bi-calendar"></i>

                        <input
                                id="dueDate"
                                type="date"
                                class="form-control"
                                th:field="*{dueDate}"
                                required>

                    </div>

                    <small class="error-message"
                           th:if="${#fields.hasErrors('dueDate')}"
                           th:errors="*{dueDate}">
                    </small>

                </div>





                <!-- Due Time -->

                <div class="form-group">

                    <label for="dueTime">
                        Due Time
                    </label>

                    <div class="input-with-icon">

                        <i class="bi bi-clock"></i>

                        <input
                                id="dueTime"
                                type="time"
                                class="form-control"
                                th:field="*{dueTime}">

                    </div>

                </div>





                <!-- Recurrence -->

                <div class="form-group">

                    <label for="recurrenceType">
                        Occurs <span class="required">*</span>
                    </label>

                    <select
                            id="recurrenceType"
                            class="form-control"
                            th:field="*{recurrenceType}"
                            required>
                        <option th:each="rec : ${T(com.studyflow.studyflow.entity.RecurrenceType).values()}"
                                th:value="${rec.name()}"
                                th:text="${rec.name()}"
                                th:selected="${rec == taskDto.recurrenceType}">
                        </option>
                    </select>

                    <small class="error-message"
                           th:if="${#fields.hasErrors('recurrenceType')}"
                           th:errors="*{recurrenceType}">
                    </small>

                </div>





                <!-- Details -->

                <div class="form-group">

                    <label for="details">
                        Details
                    </label>

                    <textarea
                            id="details"
                            class="form-control"
                            rows="4"
                            th:field="*{details}"
                            placeholder="Optional: Add notes, links, or additional context...">
                    </textarea>

                    <small class="error-message"
                           th:if="${#fields.hasErrors('details')}"
                           th:errors="*{details}">
                    </small>

                </div>





                <!-- Completion Status -->
                <div class="form-group" th:if="${taskDto.id != null}">
                    <label>Status</label>
                    <div class="form-control-static">
                        <span class="status-badge" th:classappend="${taskDto.completed ? ' completed' : ' pending'}"
                              th:text="${taskDto.completed ? 'Completed' : 'In Progress'}">
                            In Progress
                        </span>
                        <span class="progress-display" th:text="${taskDto.progress} + '%'">0%</span>
                    </div>
                </div>





                <!-- Buttons -->

                <div class="form-actions">

                    <a th:href="@{/tasks}"
                       class="btn btn-secondary">

                        <i class="bi bi-arrow-left"></i>

                        Cancel

                    </a>

                    <button
                            type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-check-circle"></i>

                        Update Task

                    </button>

                </div>

            </form>

        </div>

    </section>

</div>

</div>

</body>
</html>
