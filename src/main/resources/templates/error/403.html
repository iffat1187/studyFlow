<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- =========================================================
     StudyFlow — 403 Access Denied
     Standalone page rendered by Spring Boot's error handling
     whenever an authenticated user lacks the required role.
     It never exposes exception details, stack traces or the
     requested URL internals — only a safe, branded message.
========================================================== -->

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>Access Denied · StudyFlow</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Standalone page styles (shared with auth pages) -->
    <link rel="stylesheet" th:href="@{/css/auth.css}">

</head>

<body class="auth-page">

    <!-- Decorative background glows -->
    <div class="auth-glow auth-glow--one" aria-hidden="true"></div>
    <div class="auth-glow auth-glow--two" aria-hidden="true"></div>

    <main class="auth-card auth-card--error">

        <!-- ==========================
             Error Icon
        =========================== -->

        <div class="error-code" aria-hidden="true">
            403
        </div>

        <div class="error-icon">
            <i class="bi bi-shield-lock"></i>
        </div>

        <h1 class="auth-title">
            Access Denied
        </h1>

        <p class="auth-subtitle">
            You do not have permission to access this page.
        </p>

        <!-- ==========================
             Safe Actions
        =========================== -->

        <div class="error-actions">

            <a th:href="@{/dashboard}" class="auth-btn">
                <i class="bi bi-grid"></i>
                Back to Dashboard
            </a>

            <a th:href="@{/}" class="auth-btn auth-btn--ghost">
                <i class="bi bi-house-door"></i>
                Back to Landing Page
            </a>

        </div>

        <!-- ==========================
             Anonymous hint (safe, no internals)
        =========================== -->

        <p class="auth-alt" sec:authorize="isAnonymous()">
            Sign in to continue:
            <a th:href="@{/login}">Sign In</a>
        </p>

    </main>

    <footer class="auth-footer">
        &copy; 2026 StudyFlow. All rights reserved.
    </footer>

</body>

</html>
