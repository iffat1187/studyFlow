<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content)">

<head>

    <!-- ==========================================
         Meta Information
    =========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <!-- ==========================================
         Page Title
    =========================================== -->

    <title>
        StudyFlow | Smart Study Planner
    </title>

    <!-- ==========================================
         CSRF Token for AJAX requests
    =========================================== -->

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}">


    <!-- ==========================================
         Bootstrap Icons
    =========================================== -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- ==========================================
         StudyFlow Main Stylesheet
    =========================================== -->

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet"
          th:href="@{/css/subject.css}">

    <link rel="stylesheet"
          th:href="@{/css/topic.css}">

    <link rel="stylesheet"
          th:href="@{/css/task.css}">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

    <link rel="stylesheet"
          th:href="@{/css/dashboard.css}">

    <link rel="stylesheet"
          th:href="@{/css/exam.css}">

    <link rel="stylesheet"
          th:href="@{/css/study-session.css}">

    <link rel="stylesheet"
          th:href="@{/css/focus-timer.css}">

    <link rel="stylesheet"
          th:href="@{/css/analytics.css}">

    <link rel="stylesheet"
          th:href="@{/css/calendar.css}">

    <link rel="stylesheet"
          th:href="@{/css/notification.css}">

    <link rel="stylesheet"
          th:href="@{/css/profile.css}">

    <link rel="stylesheet"
          th:href="@{/css/settings.css}">
</head>

<body>


<!-- ==========================================
     Scroll Progress Bar
=========================================== -->

<div id="scrollProgress"></div>


<!-- ==========================================
     Application Layout
=========================================== -->

<div class="app-shell">

    <!-- ==========================================
         Application Layout
    =========================================== -->

    <div class="app-layout">


    <!-- ==========================================
         Sidebar
    =========================================== -->

    <aside class="sidebar-wrapper">

        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    </aside>



    <!-- ==========================================
         Main Content Area
    =========================================== -->

    <div class="main-content">


        <!-- ==========================================
             Navbar
        =========================================== -->

        <header class="navbar-wrapper">

            <div th:replace="~{fragments/navbar :: navbar}"></div>

        </header>



        <!-- ==========================================
             Dynamic Page Content
        =========================================== -->

        <main class="page-content">

            <div class="page-container">

                <div th:replace="${content}"></div>

            </div>

        </main>

        </div>

    </div>

    <!-- ==========================================
         Global Footer
         Single application-wide footer — NOT part
         of the sidebar navigation.
    =========================================== -->

    <div th:replace="~{fragments/footer :: footer}"></div>

</div>



<!-- ==========================================
     Toast Notification Container
=========================================== -->

<div class="toast-container">

</div>



<!-- ==========================================
      StudyFlow Main JavaScript
=================================================== -->

<script th:src="@{/js/script.js}"></script>
<script th:src="@{/js/task.js}"></script>
<script th:src="@{/js/exam.js}"></script>
<script th:src="@{/js/study-session.js}"></script>
<script th:src="@{/js/focus-timer.js}"></script>
<script th:src="@{/js/notification.js}"></script>
<script th:src="@{/js/profile.js}"></script>

<div th:replace="~{fragments/flash :: flashToasts}"></div>

</body>

</html>
