
# ==========================================
# Application Configuration
# ==========================================

spring.application.name=studyflow


# Server Port
server.port=8006



# ==========================================
# Database Configuration (MySQL)
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/studyflow_db?createDatabaseIfNotExist=true

spring.datasource.username=root

spring.datasource.password=iffat517

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# ==========================================
# JPA / Hibernate Configuration
# ==========================================

# Automatically create/update database tables
spring.jpa.hibernate.ddl-auto=update


# Show SQL queries in console
spring.jpa.show-sql=true


# Format SQL queries
spring.jpa.properties.hibernate.format_sql=true


# Hibernate dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect



# ==========================================
# Thymeleaf Configuration
# ==========================================

# Disable cache during development
spring.thymeleaf.cache=false


# ==========================================
# Spring Security
# ==========================================

# Temporary development login (used only until the DB-backed
# UserDetailsService is implemented in a later authentication phase).
# {noop}= stores the password in plain text for this dev-only user.
spring.security.user.name=admin
spring.security.user.password={noop}admin123


# ==========================================
# Error Handling
# ==========================================



# ==========================================
# Notifications & Reminders Scheduling
# ==========================================

# Application-local timezone used by the scheduled notification job and all
# date calculations (LocalDate.now()). Set to the students' local time.
studyflow.timezone=Asia/Dhaka

# Daily cron expression (6 fields: second minute hour day month dow) for
# running the notification generation rules. Runs once per day in the early
# morning at 03:15 local time, before the new day's due/overdue/reminder
# state needs to be reflected. The rules are idempotent (deterministic
# source keys), so re-runs, restarts and manual triggers never duplicate.
# Cron: 0 15 3 * * *   -> every day at 03:15 in the studyflow.timezone.
notification.scheduler.cron=0 15 3 * * *


# ==========================================
# Notification Retention (conservative)
# ==========================================

# How long READ notification rows are retained before automatic cleanup.
# Unread notifications are NEVER auto-removed regardless of age. Cleanup
# only touches the Notification table, never Users/Tasks/Exams/Sessions/
# Subjects/Topics.
notification.retention.days=90

# Weekly cron (6 fields) for the conservative retention cleanup. Runs once
# per week on Sunday at 03:30 local time in the studyflow.timezone.
# Cron: 0 30 3 * * SUN  -> every Sunday at 03:30.
notification.retention.cron=0 30 3 * * SUN


# ==========================================
# Profile Picture Upload
# ==========================================

# Spring multipart limits. Real JPG/JPEG/PNG images rarely exceed a few
# hundred KB, so 2 MB is a generous ceiling that still blocks abuse.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB


# Directory where validated profile images are stored. Relative to the
# working directory (project root during development); configurable for any
# deployment. Never bundled into the application JAR.
app.upload.profile-images=uploads/profile-images

# Storage-side size guard (MB). Mirrors the multipart limit above and gives a
# clear application-level message independent of the container.
app.upload.profile-images.max-size-mb=2


# ==========================================
# Password Reset & Email
# ==========================================

# Base URL used to build the password-reset link in the emailed message.
# Must point to the externally available address of this application.
studyflow.base-url=http://localhost:8006

# Application display name used in emailed messages.
studyflow.app.name=StudyFlow

# Sender address used for password-reset emails.
studyflow.mail.from=no-reply@studyflow.app

# Token lifetime in minutes. Kept short to reduce the risk window.
studyflow.password-reset.token-expiry-minutes=30

