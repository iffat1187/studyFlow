
# ==========================================
# Application Configuration
# ==========================================

spring.application.name=studyflow


# Server Port
server.port=8006



# ==========================================
# Database Configuration (MySQL)
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/studyflow_db?createDatabaseIfNotExist=true

spring.datasource.username=root

spring.datasource.password=iffat517

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# ==========================================
# JPA / Hibernate Configuration
# ==========================================

# Automatically create/update database tables
spring.jpa.hibernate.ddl-auto=update


# Show SQL queries in console
spring.jpa.show-sql=true


# Format SQL queries
spring.jpa.properties.hibernate.format_sql=true


# Hibernate dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect



# ==========================================
# Thymeleaf Configuration
# ==========================================

# Disable cache during development
spring.thymeleaf.cache=false


# ==========================================
# Error Handling
# ==========================================

